# Đẩy SDK lên GitHub Packages. Chạy khi push tag v* hoặc bấm tay trên tab Actions.
# Dùng GITHUB_TOKEN sẵn có của Actions nên không phải tạo PAT để publish.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github          # khớp <distributionManagement><id>
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Test
        run: mvn -B test

      - name: Deploy
        run: mvn -B deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
